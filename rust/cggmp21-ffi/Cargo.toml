[package]
name = "cggmp21-ffi"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "cggmp21_ffi"
crate-type = ["staticlib", "cdylib"]

[dependencies]
cggmp21 = { version = "0.6.3", features = ["curve-secp256k1", "state-machine", "spof"] }
key-share = { version = "0.6", default-features = false, features = ["serde"] }
generic-ec = { version = "0.4", default-features = false, features = ["curve-secp256k1", "serde", "std"] }
round-based = { version = "0.4.1", default-features = false, features = ["state-machine"] }

rand_core = { version = "0.6", default-features = false, features = ["getrandom"] }
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
